<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Premium Cricket Prediction</title>

<style>
body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: radial-gradient(circle at top, #0f172a, #020617);
    color: white;
    text-align: center;
}

/* Container */
.container {
    padding: 30px 20px;
}

/* Logo */
.logo img {
    width: 120px;
    border-radius: 50%;
    box-shadow: 0 0 25px rgba(0,255,255,0.4);
}

/* Heading */
h1 {
    margin-top: 15px;
    font-size: 28px;
    font-weight: 700;
    background: linear-gradient(90deg,#00f5ff,#00ff87);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

/* Subtitle */
.subtitle {
    color: #94a3b8;
    font-size: 14px;
    margin-bottom: 25px;
}

/* Cards */
.card {
    background: rgba(255,255,255,0.05);
    border-radius: 15px;
    padding: 15px;
    margin: 10px auto;
    width: 90%;
    max-width: 350px;
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.1);
}

/* Button */
.join-btn {
    display: inline-block;
    margin-top: 25px;
    padding: 15px 30px;
    font-size: 18px;
    font-weight: bold;
    color: #fff;
    text-decoration: none;
    border-radius: 50px;
    background: linear-gradient(90deg,#00ff87,#00f5ff);
    box-shadow: 0 0 20px rgba(0,255,200,0.6);
    transition: 0.3s;
}

.join-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 0 30px rgba(0,255,200,1);
}

/* Footer */
.footer {
    margin-top: 30px;
    font-size: 12px;
    color: #64748b;
}
</style>

</head>

<body>

<div class="container">

    <!-- Logo -->
    <div class="logo">
        <img src="logo.png" alt="Logo">
    </div>

    <!-- Heading -->
    <h1>AYUSHMAN CRICKET</h1>

    <!-- Cards -->
    <div class="card">✔️ 100% Match Analysis</div>

    <div class="card">✔️ High Winning Accuracy</div>
    <div class="card">✔️ Daily Premium Tips</div>

    <!-- Button -->
    <a href="https://t.me/+RNNwZdf9eQkwNGI1" target="_blank" class="join-btn">
        Join Telegram 🚀

    <!-- Footer -->
    <div class="footer">

</html>
